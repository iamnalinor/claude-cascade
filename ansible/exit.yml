---
- name: Install the Happ cascade exit
  hosts: exit_nodes
  become: true
  serial: 1
  gather_subset: ["!all"]
  vars:
    xray_version: v26.10.31
    xray_release_dir: "/usr/local/lib/happ-exit/{{ xray_version }}"
    xray_artifacts:
      x86_64:
        name: Xray-linux-64.zip
        sha256: e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214
      aarch64:
        name: Xray-linux-arm64-v8a.zip
        sha256: 1811c8f1da0c3b6dc707ebaf1c8390e987ba39859a8f0a7aadd8526157f2ec8d
    configured_exit_port: "{{ exit_port | default(443) }}"
    configured_exit_listen: "{{ exit_listen | default('::') }}"
    configured_exit_security: "{{ exit_security | default('reality') }}"
    configured_reality_target_port: "{{ reality_target_port | default(443) }}"
    configured_exit_export_dir: "{{ exit_export_dir | default(playbook_dir ~ '/../.local') }}"
  tasks:
    - name: Validate OS, ports and TLS hostnames
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.distribution == "Debian" and
             ansible_facts.distribution_major_version in ["12", "13"]) or
            (ansible_facts.distribution == "Ubuntu" and
             ansible_facts.distribution_version in ["24.04", "26.04"])
          - ansible_facts.architecture in xray_artifacts
          - ansible_facts.service_mgr == "systemd"
          - exit_address is defined and exit_address | length > 0
          - configured_exit_port | int >= 1 and configured_exit_port | int <= 65535
          - configured_exit_security in ["reality", "tls"]
      tags: [preflight]

    - name: Validate REALITY target
      ansible.builtin.assert:
        that:
          - configured_reality_target_port | int >= 1 and configured_reality_target_port | int <= 65535
          - reality_target_host is defined and reality_target_host is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - reality_server_name is defined and reality_server_name is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - reality_target_host != exit_address
      when: configured_exit_security == 'reality'
      tags: [preflight]

    - name: Validate requirements for TLS with an IP certificate
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - |
            import ipaddress, shutil, sys
            ipaddress.IPv4Address(sys.argv[1])
            if not shutil.which("openssl"):
                raise SystemExit("openssl is required in TLS mode")
          - "{{ exit_address }}"
      changed_when: false
      check_mode: false
      when: configured_exit_security == 'tls'
      tags: [preflight]

    - name: Inspect the configured TCP port
      ansible.builtin.command:
        argv: [ss, -Hlnpt, "sport = :{{ configured_exit_port | int }}"]
      register: exit_listener
      changed_when: false
      check_mode: false
      tags: [preflight]

    - name: Look up the PID of the managed service
      ansible.builtin.command:
        argv: [systemctl, show, --property=MainPID, --value, happ-exit.service]
      register: exit_service_pid
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [preflight]

    - name: Require the port to be free or held by the managed Xray process
      ansible.builtin.assert:
        that:
          - >-
            exit_listener.stdout_lines | length == 0 or
            (exit_service_pid.stdout | int > 0 and
             (exit_listener.stdout_lines | reject('search', 'pid=' ~ (exit_service_pid.stdout | trim) ~ ',') | list | length == 0))
        fail_msg: "TCP {{ configured_exit_port }} is held by another service. Set exit_port to a free port."
      tags: [preflight]

    - name: Verify that the TLS target accepts the server name and negotiates TLS 1.3 with h2
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - |
            import socket, ssl, sys
            host, port, name, exit_host = sys.argv[1:]
            target_ips = {e[4][0] for e in socket.getaddrinfo(host, int(port), type=socket.SOCK_STREAM)}
            exit_ips = {e[4][0] for e in socket.getaddrinfo(exit_host, 0, type=socket.SOCK_STREAM)}
            if target_ips & exit_ips:
                raise SystemExit("The TLS target resolves to an address of this exit")
            context = ssl.create_default_context()
            context.minimum_version = ssl.TLSVersion.TLSv1_3
            context.set_alpn_protocols(["h2"])
            with socket.create_connection((host, int(port)), timeout=7) as sock:
                with context.wrap_socket(sock, server_hostname=name) as tls:
                    if tls.selected_alpn_protocol() != "h2":
                        raise SystemExit("TLS target did not negotiate h2")
          - "{{ reality_target_host }}"
          - "{{ configured_reality_target_port }}"
          - "{{ reality_server_name }}"
          - "{{ exit_address }}"
      changed_when: false
      check_mode: false
      when: configured_exit_security == 'reality'
      tags: [preflight]

    - name: Create the system group
      ansible.builtin.group:
        name: happ-exit
        system: true

    - name: Create the service user
      ansible.builtin.user:
        name: happ-exit
        group: happ-exit
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create release and configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ xray_release_dir }}", group: root, mode: "0755" }
        - { path: /etc/happ-exit, group: happ-exit, mode: "0750" }

    - name: Check whether this pinned release is already installed
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - |
            import os, sys
            from pathlib import Path
            directory = Path(sys.argv[1])
            try:
                complete = (directory / ".installed").read_text().strip() == sys.argv[2]
                complete = complete and os.access(directory / "xray", os.X_OK)
                complete = complete and all(
                    (directory / name).stat().st_size > 0
                    for name in ("xray", "geoip.dat", "geosite.dat")
                )
            except FileNotFoundError:
                complete = False
            sys.exit(0 if complete else 1)
          - "{{ xray_release_dir }}"
          - "{{ xray_version }}"
      register: xray_install
      changed_when: false
      failed_when: xray_install.rc not in [0, 1]
      check_mode: false

    - name: Install the pinned Xray archive
      when: xray_install.rc != 0 and not ansible_check_mode
      block:
        - name: Download and verify Xray
          ansible.builtin.get_url:
            url: "https://github.com/XTLS/Xray-core/releases/download/{{ xray_version }}/{{ xray_artifacts[ansible_facts.architecture].name }}"
            checksum: "sha256:{{ xray_artifacts[ansible_facts.architecture].sha256 }}"
            dest: "{{ xray_release_dir }}/xray.zip"
            owner: root
            group: root
            mode: "0644"

        - name: Unpack Xray and its geodata using the existing Python runtime
          ansible.builtin.command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - -c
              - |
                import os, shutil, sys, zipfile
                directory = sys.argv[1]
                with zipfile.ZipFile(os.path.join(directory, "xray.zip")) as archive:
                    for name, mode in (("xray", 0o755), ("geoip.dat", 0o644), ("geosite.dat", 0o644)):
                        target = os.path.join(directory, name)
                        temporary = target + ".tmp"
                        with archive.open(name) as source, open(temporary, "wb") as output:
                            shutil.copyfileobj(source, output)
                        os.chmod(temporary, mode)
                        os.replace(temporary, target)
              - "{{ xray_release_dir }}"

        - name: Record successful installation
          ansible.builtin.copy:
            dest: "{{ xray_release_dir }}/.installed"
            content: "{{ xray_version }}\n"
            owner: root
            group: root
            mode: "0644"

    - name: Configure the Xray service
      when: not ansible_check_mode or xray_install.rc == 0
      block:
        - name: Generate stable keys and credentials on first install
          ansible.builtin.command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - -c
              - |
                import json, os, secrets, subprocess, sys, tempfile, uuid
                binary, path = sys.argv[1:]
                keys = dict(line.split(": ", 1) for line in subprocess.check_output(
                    [binary, "x25519"], text=True).splitlines())
                state = {
                    "private_key": keys["PrivateKey"],
                    "public_key": keys["Password (PublicKey)"],
                    "short_id": secrets.token_hex(8),
                    "uuid": str(uuid.uuid4()),
                }
                fd, temporary = tempfile.mkstemp(dir=os.path.dirname(path))
                try:
                    with os.fdopen(fd, "w") as handle:
                        json.dump(state, handle)
                        handle.flush()
                        os.fsync(handle.fileno())
                    try:
                        os.link(temporary, path)
                    except FileExistsError:
                        pass
                    dir_fd = os.open(os.path.dirname(path), os.O_DIRECTORY)
                    try:
                        os.fsync(dir_fd)
                    finally:
                        os.close(dir_fd)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
              - "{{ xray_release_dir }}/xray"
              - /etc/happ-exit/identity.json
            creates: /etc/happ-exit/identity.json
          no_log: true

        - name: Read only the client fields of the server identity
          ansible.builtin.command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - -c
              - |
                import json, sys
                with open(sys.argv[1]) as handle:
                    state = json.load(handle)
                print(json.dumps({key: state[key] for key in ("public_key", "short_id", "uuid")}))
              - /etc/happ-exit/identity.json
          register: exit_identity
          changed_when: false
          check_mode: false
          no_log: true

        - name: Parse server identity
          ansible.builtin.set_fact:
            exit_material: "{{ exit_identity.stdout | from_json }}"
          no_log: true

        - name: Prepare the IP-bound TLS certificate on the exit
          ansible.builtin.command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - -c
              - "{{ lookup('ansible.builtin.file', 'files/prepare-ip-tls.py') }}"
              - /etc/happ-exit/tls
              - "{{ exit_address }}"
          register: exit_tls
          changed_when: (exit_tls.stdout | from_json).changed
          notify: Restart happ-exit
          when: configured_exit_security == 'tls' and not ansible_check_mode

        - name: Validate and install the configuration on the exit
          ansible.builtin.command:
            argv:
              - "{{ ansible_facts.python.executable }}"
              - -c
              - "{{ lookup('ansible.builtin.file', 'files/install-config.py') }}"
              - "{{ xray_release_dir }}/xray"
              - /etc/happ-exit
            stdin: "{{ lookup('ansible.builtin.template', 'templates/config.json.j2') | to_json }}"
          environment:
            XRAY_LOCATION_ASSET: "{{ xray_release_dir }}"
          register: exit_config
          changed_when: exit_config.stdout == 'changed'
          notify: Restart happ-exit
          no_log: true
          when: not ansible_check_mode

        - name: Install the systemd unit
          ansible.builtin.template:
            src: happ-exit.service.j2
            dest: /etc/systemd/system/happ-exit.service
            owner: root
            group: root
            mode: "0644"
          notify: Restart happ-exit

        - name: Apply pending service changes
          ansible.builtin.meta: flush_handlers

        - name: Enable and start the exit service
          ansible.builtin.systemd_service:
            name: happ-exit
            enabled: true
            state: started

        - name: Wait for the new listener
          ansible.builtin.wait_for:
            host: "{{ '::1' if configured_exit_listen == '::' else ('127.0.0.1' if configured_exit_listen == '0.0.0.0' else configured_exit_listen) }}"
            port: "{{ configured_exit_port }}"
            timeout: 15
          when: not ansible_check_mode

        - name: Create a private controller directory for the client outbound
          ansible.builtin.file:
            path: "{{ configured_exit_export_dir }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false
          when: not ansible_check_mode

        - name: Export the client outbound to the controller
          ansible.builtin.template:
            src: client-outbound.json.j2
            dest: "{{ configured_exit_export_dir }}/{{ inventory_hostname }}-outbound.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          diff: false
          when: not ansible_check_mode

  handlers:
    - name: Restart happ-exit
      ansible.builtin.systemd_service:
        name: happ-exit
        daemon_reload: true
        state: restarted
